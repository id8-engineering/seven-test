name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Release Seven Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          path: seven-test
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Set up Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: seven-test
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ubuntu-22.04

      - name: Build firmware
        working-directory: seven-test
        run: west build -p always -b seven/nrf9151/ns tests

      - name: Prepare firmware
        working-directory: seven-test
        run: cp build/tests/zephyr/tfm_merged.hex seven-test.hex

      - name: Upload firmware
        working-directory: seven-test
        run: gh release upload "${{ github.event.release.tag_name }}" seven-test.hex
        env:
          GH_TOKEN: ${{ github.token }}
